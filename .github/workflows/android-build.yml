name: Build QuickTouch Assist APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK & accept licenses
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR=$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMGR" ]; then
            echo "::error title=Android SDK Setup Failed::sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
          "$SDKMGR" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || true

      - name: Restore or create debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: |
          set -o pipefail
          if [ -f ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            CMD="./gradlew"
          else
            CMD="gradle"
          fi
          if ! "$CMD" assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_build.log; then
            ERR_MSG=$(grep -E "FAILURE:|What went wrong:|Could not|Execution failed|Exception|ERROR:" gradle_build.log | head -n 12 | tr '\n' ' ')
            if [ -z "$ERR_MSG" ]; then
              ERR_MSG=$(tail -n 15 gradle_build.log | tr '\n' ' ')
            fi
            echo "::error title=Gradle Build Failed::$ERR_MSG"
            exit 1
          fi

      - name: Prepare APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk QuickTouch-Assist-debug.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuickTouch-Assist-debug-apk
          path: QuickTouch-Assist-debug.apk
          retention-days: 90

      - name: Publish APK to GitHub Releases (Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: QuickTouch-Assist-debug.apk
          generate_release_notes: true

      - name: Update Latest APK Release (Main Branch)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest-apk
          target_commitish: ${{ github.sha }}
          name: QuickTouch Assist — Latest Build
          body: |
            Automated build from `${{ github.ref_name }}` (${{ github.sha }}).
            Download **QuickTouch-Assist-debug.apk** below to install on your Android device.
          files: QuickTouch-Assist-debug.apk
          prerelease: true
