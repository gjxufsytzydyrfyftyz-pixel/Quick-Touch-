name: Build QuickTouch Assist APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk QuickTouch-Assist-debug.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuickTouch-Assist-debug-apk
          path: QuickTouch-Assist-debug.apk
          retention-days: 90

      - name: Publish APK to GitHub Releases (Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: QuickTouch-Assist-debug.apk
          generate_release_notes: true

      - name: Update Latest APK Release (Main Branch)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: QuickTouch Assist — Latest Build
          body: |
            Automated build from `${{ github.ref_name }}` (${{ github.sha }}).
            Download **QuickTouch-Assist-debug.apk** below to install on your Android device.
          files: QuickTouch-Assist-debug.apk
          prerelease: true
